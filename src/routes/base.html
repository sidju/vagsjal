<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ead0c3">
    <link rel="icon" href="/favicon.png" type="image/png">
    <title>VägSjäl: {% block title %}platshållartitel{% endblock %}</title>
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <nav class="site-nav">
          <div class="nav-inner">
            <a class="brand" href="/">
              <img class="brand-mark" src="/vs-rr.png" alt="" aria-hidden="true">
              <span class="nav-title">VägSjäl: Regentens Rekviem</span>
            </a>
            <div class="nav-links">
              <a href="/">Hem</a>
              <a href="/characters/">Karaktärer</a>
              <a href="/character/">Karaktärsblad</a>
              <details class="nav-dropdown">
                <summary>Wiki</summary>
                <div class="nav-dropdown-panel">
                  {% include "wiki_nav_partial.html" %}
                </div>
              </details>
              {% if show_admin_link %}
              <a href="/admin/">Admin</a>
              {% endif %}
            </div>
          </div>
        </nav>
        <div class="page-paths" id="page-paths" aria-label="Sökväg"></div>
      </header>
      {% block header_extra %}{% endblock %}
      <script>
        (() => {
          const container = document.getElementById('page-paths');
          if (!container) return;

          const labels = {
            'character': 'Karaktärsblad',
            'characters': 'Karaktärer',
            'admin': 'Admin',
            'user': 'Användare',
            'edit': 'Redigera',
            'accounts': 'Konton',
            'groupings': 'Grupperingar',
            'transactions': 'Transaktioner',
            'account-changes': 'Kontoförändringar',
            'imported-account-changes': 'Importerade kontoförändringar',
            'wiki': 'Wiki',
          };

          const parts = window.location.pathname.split('/').filter(Boolean);
          if (parts.length === 0) return;

          const links = [{ href: '/', label: 'Hem' }];
          let path = '/';
          for (let i = 0; i < parts.length - 1; i++) {
            path += `${parts[i]}/`;
            const label = labels[parts[i]] || decodeURIComponent(parts[i])
              .replace(/[-_]+/g, ' ')
              .replace(/\b\w/g, (c) => c.toUpperCase());
            links.push({ href: path, label });
          }

          container.innerHTML = links.map(({ href, label }) => `<a href="${href}">${label}</a>`).join(' <span>/</span> ');
        })();
      </script>
      <main>
        {% block body %}Innehåll{% endblock %}
      </main>
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
