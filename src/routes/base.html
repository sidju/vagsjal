<!DOCTYPE html>
<html>
  <head>
    <title>Bookkeep: {% block title %}placeholder title{% endblock %}</title>
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <span class="nav-title">The Nightly Grind</span>
        <div class="nav-links">
          <a href="/">Home</a>
          {% if show_admin_link %}
          <a href="/admin/">Admin</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <div class="page-paths" id="page-paths" aria-label="Breadcrumb"></div>
    <script>
      (() => {
        const container = document.getElementById('page-paths');
        if (!container) return;

        const parts = window.location.pathname.split('/').filter(Boolean);
        if (parts.length === 0) return;

        const links = [{ href: '/', label: 'Home' }];
        let path = '/';
        for (let i = 0; i < parts.length - 1; i++) {
          path += `${parts[i]}/`;
          const label = decodeURIComponent(parts[i])
            .replace(/[-_]+/g, ' ')
            .replace(/\b\w/g, (c) => c.toUpperCase());
          links.push({ href: path, label });
        }

        container.innerHTML = links.map(({ href, label }) => `<a href="${href}">${label}</a>`).join(' <span>/</span> ');
      })();
    </script>
    <main>
      {% block body %}Placeholder content{% endblock %}
    </main>
  </body>
</html>
