{% extends "base.html" %}

{% block title %}Redigera karaktär {{ character.vampire_id }}{% endblock %}

{% block body %}
  <h1>Redigera {{ character.name }}</h1>
  <p>Ägare: {{ character.owner_name }}</p>

  <form method="post" enctype="application/x-www-form-urlencoded">
    <input type="hidden" name="action" value="update">
    <p>
      <label>Ägare
        <select name="user_id">
          {% for user in users %}
          <option value="{{ user.user_id }}" {% if user.user_id == character.user_id %}selected{% endif %}>{{ user.name }}</option>
          {% endfor %}
        </select>
      </label>
    </p>
    <p>
      <label>Status
        <select name="status">
          <option value="draft" {% if character.status.is_draft() %}selected{% endif %}>Utkast</option>
          <option value="active" {% if character.status.is_active() %}selected{% endif %}>Aktiv</option>
          <option value="inactive" {% if character.status.is_inactive() %}selected{% endif %}>Inaktiv</option>
        </select>
      </label>
    </p>

    <h3>Offentliga fält</h3>
    <table class="stat-table">
      <tr>
        <td><label for="name">Namn</label></td>
        <td><input id="name" name="name" value="{{ character.name }}"></td>
      </tr>
      <tr>
        <td><label for="apparent_age">Mänsklig ålder</label></td>
        <td><input id="apparent_age" name="apparent_age" type="number" value="{{ character.apparent_age }}"></td>
      </tr>
      <tr>
        <td><label for="clan_id">Klan</label></td>
        <td>
          <select id="clan_id" name="clan_id">
            {% for clan in clans %}
            <option value="{{ clan.clan_id }}" {% if clan.clan_id == character.clan_id %}selected{% endif %}>{{ clan.name }}</option>
            {% endfor %}
          </select>
        </td>
      </tr>
      <tr>
        <td><label for="home_domain">Hemdomän</label></td>
        <td><input id="home_domain" name="home_domain" value="{{ character.home_domain }}" placeholder="t.ex. Göteborg, Paris"></td>
      </tr>
      <tr>
        <td><label for="known_age">Känd ålder</label></td>
        <td><input id="known_age" name="known_age" value="{{ character.known_age }}" placeholder="t.ex. omkring 50"></td>
      </tr>
      <tr>
        <td><label for="covenant_id">Kovenant</label></td>
        <td>
          <select id="covenant_id" name="covenant_id">
            <option value="">Inget</option>
            {% for covenant in covenants %}
            <option value="{{ covenant.covenant_id }}" {% if covenant.covenant_id == character.covenant_id %}selected{% endif %}>{{ covenant.name }}</option>
            {% endfor %}
          </select>
        </td>
      </tr>
      <tr>
        <td><label for="public_knowledge">Allmänt känt</label></td>
        <td><textarea id="public_knowledge" name="public_knowledge" rows="3" cols="60">{{ character.public_knowledge }}</textarea></td>
      </tr>
    </table>

    <h3 style="opacity:0.8">Privata fält</h3>
    <table class="stat-table" style="opacity:0.8">
      <tr>
        <td><label for="character_description_url">Länk till karaktärsbeskrivning</label></td>
        <td><input id="character_description_url" name="character_description_url" type="url" {% if let Some(url) = character.character_description_url %}value="{{ url }}"{% else %}placeholder="https://docs.google.com/..."{% endif %}></td>
      </tr>
      <tr>
        <td><label for="date_embraced">Datum för omfamning</label></td>
        <td><input id="date_embraced" name="date_embraced" type="date" value="{{ character.date_embraced }}"></td>
      </tr>
      <tr>
        <td colspan="2">Torpor</td>
      </tr>
      <tr>
        <td><label for="torpor_years">år</label></td>
        <td><input id="torpor_years" name="torpor_years" type="number" value="{{ character.torpor_time.months / 12 }}"></td>
      </tr>
      <tr>
        <td><label for="torpor_months">månader</label></td>
        <td><input id="torpor_months" name="torpor_months" type="number" value="{{ character.torpor_time.months % 12 }}"></td>
      </tr>
      <tr>
        <td><label for="torpor_days">dagar</label></td>
        <td><input id="torpor_days" name="torpor_days" type="number" value="{{ character.torpor_time.days }}"></td>
      </tr>
    </table>
    <br>
    <button type="submit">Spara</button>
  </form>
{% endblock %}
