{% extends "base.html" %}

{% block title %}Edit character {{ character.vampire_id }}{% endblock %}

{% block body %}
  <h1>Edit {{ character.name }}</h1>
  <p>Owner: {{ character.owner_name }}</p>

  <form method="post" enctype="application/x-www-form-urlencoded">
    <input type="hidden" name="action" value="update">
    <p>
      <label>Owner
        <select name="user_id">
          {% for user in users %}
          <option value="{{ user.user_id }}" {% if user.user_id == character.user_id %}selected{% endif %}>{{ user.name }}</option>
          {% endfor %}
        </select>
      </label>
    </p>
    <p><label>Name <input name="name" value="{{ character.name }}"></label></p>
    <p><label>Apparent age <input name="apparent_age" type="number" value="{{ character.apparent_age }}"></label></p>
    <p><label>Date embraced <input name="date_embraced" type="date" value="{{ character.date_embraced }}"></label></p>
    <p><label>Torpor months <input name="torpor_months" type="number" value="{{ character.torpor_time.months }}"></label></p>
    <p><label>Torpor days <input name="torpor_days" type="number" value="{{ character.torpor_time.days }}"></label></p>
    <p>
      <label>Clan
        <select name="clan_id">
          {% for clan in clans %}
          <option value="{{ clan.clan_id }}" {% if clan.clan_id == character.clan_id %}selected{% endif %}>{{ clan.name }}</option>
          {% endfor %}
        </select>
      </label>
    </p>
    <p><label><input type="checkbox" name="active" {% if character.active %}checked{% endif %}> Active</label></p>
    <button type="submit">Save</button>
  </form>
{% endblock %}
