{% extends "base.html" %}

{% block title %}Admin users{% endblock %}

{% block body %}
  <h1>Users</h1>
  <table class="stat-table">
    <tr><th>ID</th><th>Name</th><th>OIDC subject</th><th>Role</th></tr>
    {% for user in users %}
    <tr>
      <td><a href="{{ user.user_id }}/">{{ user.user_id }}</a></td>
      <td>{{ user.name }}</td>
      <td>{{ user.oidc_subject }}</td>
      <td>{{ user.role }}</td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
