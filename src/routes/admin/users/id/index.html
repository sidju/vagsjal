{% extends "base.html" %}

{% block title %}Edit user {{ user.user_id }}{% endblock %}

{% block body %}
  <h1>User {{ user.user_id }}</h1>
  <form method="post" enctype="application/x-www-form-urlencoded">
    <p><label>Name <input name="name" value="{{ user.name }}"></label></p>
    <p><label>OIDC subject <input name="oidc_subject" value="{{ user.oidc_subject }}"></label></p>
    <p>
      <label>Role
        <select name="role">
          <option value="user" {% if user.role == "user" %}selected{% endif %}>user</option>
          <option value="storyteller" {% if user.role == "storyteller" %}selected{% endif %}>storyteller</option>
        </select>
      </label>
    </p>
    <button type="submit">Save</button>
  </form>
{% endblock %}
